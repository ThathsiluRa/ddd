name: Android companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-control-app
    paths:
      - "v9/android-app/**"
      - "v9/path/control-api*.js"
      - "v9/path/handlers.js"
      - "v9/path/travas.js"
      - "v9/test/*.test.js"
      - ".github/workflows/android-companion-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test control API security helpers
        run: node --test v9/test/control-api-security.test.js

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: v9/android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Create checksum
        working-directory: v9/android-app/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shoco-control-debug-apk
          path: |
            v9/android-app/app/build/outputs/apk/debug/app-debug.apk
            v9/android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
